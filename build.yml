name: Build Solid Break (Phase 1 Debug)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-arm64-debug:
    name: Build arm64-v8a Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Solid Break repository
        uses: actions/checkout@v4

      - name: Clone upstream SolidCraft (not committed to repo)
        run: |
          rm -rf native/upstream/solidcraft
          git clone --depth 1 https://github.com/tangency-labs/solidcraft.git native/upstream/solidcraft

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Rust toolchain (edition 2024 / >= 1.95)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache Cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/solidbreak-rust

      - name: Install cargo-ndk
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - name: Locate Android NDK
        run: |
          NDK_DIR=$(ls -d "$ANDROID_SDK_ROOT/ndk/"* 2>/dev/null | sort -V | tail -n 1 || true)
          if [ -z "$NDK_DIR" ] && [ -n "$ANDROID_NDK_LATEST_HOME" ]; then
            NDK_DIR="$ANDROID_NDK_LATEST_HOME"
          fi
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK_DIR" >> "$GITHUB_ENV"
          echo "Using NDK: $NDK_DIR"

      - name: Build libsolidbreak_native.so (arm64-v8a)
        working-directory: native/solidbreak-rust
        run: |
          mkdir -p ../../android/app/src/main/jniLibs
          cargo ndk -t arm64-v8a --platform 29 -o ../../android/app/src/main/jniLibs build

      - name: Verify shared library output
        run: |
          ls -lh android/app/src/main/jniLibs/arm64-v8a/libsolidbreak_native.so

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Assemble Android Debug APK
        working-directory: android
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload Phase 1 Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: solid-break-phase1-arm64-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
